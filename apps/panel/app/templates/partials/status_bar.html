{% set status = status if status is defined else none %}
{% if status %}
{% set tone = status.tone or 'ok' %}
<div class="rounded-lg px-3 py-2 text-sm flex items-center justify-between gap-3
  {% if tone == 'danger' %}bg-red-50 text-red-900 border border-red-200
  {% elif tone == 'warn' %}bg-amber-50 text-amber-950 border border-amber-200
  {% else %}bg-teal-50 text-teal-950 border border-teal-200{% endif %}">
  <span>{{ status.label }}</span>
  {% if status.cta == '/app/bot/toggle' %}
  <form method="post" action="/app/bot/toggle" class="shrink-0">
    <button class="font-medium underline underline-offset-2">{{ status.cta_label }}</button>
  </form>
  {% elif status.cta and status.cta_label %}
  <a href="{{ status.cta }}" class="shrink-0 font-medium underline underline-offset-2">{{ status.cta_label }}</a>
  {% endif %}
</div>
{% endif %}
