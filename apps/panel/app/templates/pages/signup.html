{% extends "base.html" %}
{% block title %}Criar conta · Vendaprojeto{% endblock %}
{% block body %}
<main class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md rounded-2xl bg-white shadow-sm border border-stone-200 p-8">
    <p class="text-xs uppercase tracking-widest text-teal-700 font-semibold">Vendaprojeto</p>
    <h1 class="mt-2 text-2xl font-semibold tracking-tight">Criar conta</h1>
    <p class="mt-1 text-sm text-stone-500">Tenant + usuário owner (plano free)</p>

    {% if error %}
    <p class="mt-4 rounded-lg bg-red-50 text-red-700 text-sm px-3 py-2">{{ error }}</p>
    {% endif %}

    <form method="post" action="/signup" class="mt-6 space-y-4">
      <label class="block text-sm">
        <span class="text-stone-600">Seu nome</span>
        <input name="name" required class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2" />
      </label>
      <label class="block text-sm">
        <span class="text-stone-600">Nome do negócio / tenant</span>
        <input name="tenant_name" required class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2" />
      </label>
      <label class="block text-sm">
        <span class="text-stone-600">E-mail</span>
        <input name="email" type="email" required class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2" />
      </label>
      <label class="block text-sm">
        <span class="text-stone-600">Senha</span>
        <input name="password" type="password" required minlength="8" class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2" />
      </label>
      <button type="submit" class="w-full rounded-lg bg-teal-700 text-white py-2.5 text-sm font-medium hover:bg-teal-800">
        Criar e entrar
      </button>
    </form>
    <p class="mt-4 text-xs text-stone-400"><a href="/login" class="underline">Já tenho conta</a></p>
  </div>
</main>
{% endblock %}
