{% extends "base.html" %}
{% block title %}Login · Vendaprojeto{% endblock %}
{% block body %}
<main class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md rounded-2xl bg-white shadow-sm border border-stone-200 p-8">
    <p class="text-xs uppercase tracking-widest text-teal-700 font-semibold">Vendaprojeto</p>
    <h1 class="mt-2 text-2xl font-semibold tracking-tight">Entrar no painel</h1>
    <p class="mt-1 text-sm text-stone-500">SaaS de prospecção WhatsApp (scaffold)</p>

    {% if error %}
    <p class="mt-4 rounded-lg bg-red-50 text-red-700 text-sm px-3 py-2">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login" class="mt-6 space-y-4">
      <label class="block text-sm">
        <span class="text-stone-600">E-mail</span>
        <input name="email" type="email" required value="{{ demo_email }}"
          class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-600/40" />
      </label>
      <label class="block text-sm">
        <span class="text-stone-600">Senha</span>
        <input name="password" type="password" required
          class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-600/40" />
      </label>
      <button type="submit"
        class="w-full rounded-lg bg-teal-700 text-white py-2.5 text-sm font-medium hover:bg-teal-800 transition">
        Entrar
      </button>
    </form>
    <p class="mt-4 text-xs text-stone-400">Demo: {{ demo_email }} / senha do .env</p>
  </div>
</main>
{% endblock %}
